<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicios de vistas en MySQL</title>
<style>
:root{--ink:#1d2340;--soft:#5b6384;--bg:#f4f7ff;--ac:#6d4aff;--ac2:#2f80ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
code,pre{font-family:Consolas,"Courier New",monospace}
code{background:#eef0ff;color:#4b2fd6;padding:1px 6px;border-radius:6px;font-size:.92em}
header{padding:14px 20px;background:linear-gradient(100deg,var(--ac),var(--ac2));color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap;transition:background .3s}
header h1{font-size:1.05rem;margin:0;flex:1;min-width:200px}
.badge{background:#fff;color:var(--ac);font-weight:700;border-radius:99px;padding:4px 12px;font-size:.85rem}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{border:2px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
nav button.on{background:#fff;color:var(--ac)}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:22px 16px 10px}
.hero{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.num{flex:none;width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:3rem;font-weight:800;display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.12)}
h2{margin:0;font-size:1.9rem;line-height:1.15}
.intro{background:#fff;border-left:8px solid var(--ac);border-radius:14px;padding:14px 18px;font-size:1.08rem;line-height:1.55;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,40,90,.08)}
.part{display:flex;gap:12px;background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:9px;line-height:1.5;box-shadow:0 2px 8px rgba(30,40,90,.07)}
.part i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;font-weight:800;display:grid;place-items:center}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tools button{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;color:#1d2340;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.tools button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
#bh{background:#ffd23f}#bs{background:#4de1c1}
.box{display:none;border-radius:14px;padding:14px 18px;margin-bottom:12px;line-height:1.55;animation:o .25s}
.box.open{display:block}@keyframes o{from{opacity:0;transform:translateY(-6px)}}
.hint{background:#fff6cc;border:2px dashed #e6b800}.hint ul{margin:6px 0 0;padding-left:20px}.hint li{margin:5px 0}
.sol{background:#e6fbf6;border:2px solid #4de1c1}
.sol h4{margin:12px 0 6px;color:var(--ac)}
pre{background:#1d2340;color:#e9edff;border-radius:12px;padding:12px 14px;overflow:auto;margin:0 0 10px;font-size:.9rem;line-height:1.5}
.nt{background:#fff;border-radius:10px;padding:9px 12px;margin:7px 0}.nt b.t{color:var(--ac)}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 2px 10px rgba(30,40,90,.08);line-height:1.55}
.card h3{margin:0 0 6px}table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{border-bottom:1px solid #e3e7fb;padding:4px 6px;text-align:left}
footer{display:flex;justify-content:space-between;gap:10px;padding:12px 20px 18px;max-width:1000px;width:100%;margin:0 auto}
footer button{border:0;border-radius:14px;padding:13px 22px;font:inherit;font-weight:800;font-size:1rem;cursor:pointer;color:#fff;background:linear-gradient(100deg,var(--ac),var(--ac2));box-shadow:0 5px 0 rgba(0,0,0,.18)}
footer button:disabled{visibility:hidden}footer button:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid #1d2340;outline-offset:2px}
@media(max-width:600px){.num{width:60px;height:60px;font-size:2.2rem}h2{font-size:1.4rem}}
</style></head><body>
<header><h1>Vistas en MySQL · Clase 6</h1><nav id="nav"></nav></header>
<main id="m"></main>
<footer><button id="pv"></button><button id="nx"></button></footer>
<script>
const D=[{"n": 1, "t": "Vista para Bedelía", "c": "#ff4d6d", "c2": "#ff9f1c", "intro": "Bedelía necesita consultar el nombre, el correo y la nota final de los estudiantes inscriptos en Bases de Datos (asignatura <code>101</code>). No debe ver la clave ni ninguna columna que el requerimiento no pida.", "parts": [["A", "Creá la vista <code>vista_bedelia</code> que cumpla con la consigna."], ["B", "Escribí la consulta que usaría Bedelía sobre esa vista para ver los estudiantes ordenados de mayor a menor nota. Ejecutala y anotá cuántas filas devuelve."], ["C", "Insertá en la tabla base a Sofía Rivas (<code>sofia@utu.edu.uy</code>, asignatura 101, nota 6.00) y a Diego Rossi (<code>diego@utu.edu.uy</code>, asignatura 102, nota 8.00). Sin modificar la vista, volvé a ejecutar la consulta de B. ¿Quién aparece y quién no? Explicalo en dos líneas."], ["D", "Bedelía pide ahora ver también la columna <code>id_asignatura</code>. Modificá la vista para que la incluya."]], "hint": ["¿Qué columnas pide el requerimiento? Poné en el SELECT solo esas.", "¿Qué cláusula deja pasar únicamente a los inscriptos en la asignatura 101?", "B: para ordenar de mayor a menor existe una cláusula al final del SELECT.", "C: ¿la vista guarda filas o guarda una consulta? ¿Contra qué datos se ejecuta cada vez que la consultás?", "D: probá crear la vista con el mismo nombre y leé el error. ¿Qué sentencia permite reemplazar una definición que ya existe?"]}, {"n": 2, "t": "Boletín con JOIN", "c": "#06b6a4", "c2": "#2f80ff", "intro": "Adscripción necesita un boletín con el nombre del estudiante, el nombre de la asignatura y la nota final. Solo deben figurar los estudiantes que tienen asignatura. Hoy, cada vez que se necesita el boletín, se vuelve a escribir el JOIN entre ambas tablas.", "parts": [["A", "Creá la vista <code>vista_boletin</code>."], ["B", "Escribí la consulta SELECT sobre la vista creada para ver solo la asignatura Programación. Escribí otra para ver solo los aprobados (nota &gt;= 6) y anotá cuántas filas devuelve. ¿Aparece Ana Silva? ¿Por qué?"], ["C", "Pedro Gómez recuperó el examen y su nota pasó a 7.00. Actualizá su nota en la tabla base y repetí la consulta de aprobados sin tocar la vista. ¿Qué cambió y por qué?"], ["D", "¿Qué problema resuelve principalmente cada una de las vistas de los Ejercicios 1 y 2: restringir columnas sensibles o evitar reescribir una consulta con JOIN? Justificá en dos líneas por vista."]], "hint": ["¿Qué dos tablas necesitás y con qué columna se relacionan?", "Pensá qué tipo de JOIN deja solo las filas que tienen coincidencia en ambas tablas.", "B: mirá el <code>id_asignatura</code> de Ana Silva en los datos iniciales.", "C: ¿la vista se vuelve a evaluar cada vez que la consultás?", "D: ¿cuál vista oculta una columna? ¿cuál te ahorra escribir algo largo?", "Si Workbench muestra el error 1175 en el UPDATE (safe updates), filtrá por la clave primaria. Pedro tiene <code>id_estudiante = 3</code>."]}, {"n": 3, "t": "Informe de aprobados por asignatura", "c": "#6d4aff", "c2": "#e83e8c", "intro": "La Dirección quiere un informe que muestre, para cada asignatura del centro, la cantidad de estudiantes aprobados (nota &gt;= 6) y la nota máxima obtenida. Debe aparecer cada asignatura, incluso las que no tienen ningún aprobado.", "parts": [["A", "Creá la vista <code>vista_aprobados_por_asignatura</code> con los alias de campos <code>total_aprobados</code> y <code>nota_maxima</code>."], ["B", "Escribí la consulta que usaría la Dirección para ver solo las asignaturas con al menos un aprobado. Anotá el resultado."], ["C", "Hacé el UPDATE de la nota de Pedro Gómez a 7.00 y ejecutá el informe completo (<code>SELECT *</code> sobre la vista) sin recrearla. ¿Qué cambió y por qué?"], ["D", "Un compañero propone poner la condición <code>nota_final &gt;= 6</code> en un <code>WHERE</code> en lugar de dejarla en el <code>ON</code>. ¿Qué pasaría con el informe? Justificá."], ["E", "¿Qué problema resuelve principalmente esta vista: restringir columnas sensibles o evitar reescribir una consulta con JOIN y agrupamiento? Justificá en dos líneas."]], "hint": ["¿Qué tipo de JOIN conserva las asignaturas sin estudiantes? ¿Desde qué tabla tenés que partir?", "¿Qué función cuenta filas y cuál devuelve el mayor valor? Contá una columna del lado de estudiantes.", "Hay que agrupar por asignatura.", "¿Qué pasa con las filas de asignaturas si la condición de nota se evalúa antes o después del JOIN?", "C: ¿cuántos aprobados tenía Programación antes del UPDATE?"]}],S=null,L=['Inicio','Ejercicio 1','Ejercicio 2','Ejercicio 3'];
let i=0;const st={};
const $=s=>document.querySelector(s);
function intro(){return `<div class="hero"><div class="num" style="font-size:2.4rem">SQL</div><div><h2>Ejercicios: creación y uso de vistas</h2><p style="margin:6px 0 0;color:var(--soft)">Trabajen en grupo. Si se traban, usen el botón <b>Pista</b>.</p></div></div>
<div class="intro">Antes de cada ejercicio, ejecutá el script que restaura la base <code>utu_adscripcion</code> con los datos iniciales y elimina las vistas anteriores.</div>
<div class="tb"><div class="card"><h3>asignaturas</h3><table><tr><th>id_asignatura</th><th>nombre_asignatura</th></tr><tr><td>101</td><td>Bases de Datos</td></tr><tr><td>102</td><td>Programación</td></tr><tr><td>103</td><td>Redes</td></tr></table></div>
<div class="card"><h3>estudiantes</h3><table><tr><th>id</th><th>nombre</th><th>asig.</th><th>nota</th></tr><tr><td>1</td><td>Juan Pérez</td><td>101</td><td>9.00</td></tr><tr><td>2</td><td>María López</td><td>101</td><td>10.00</td></tr><tr><td>3</td><td>Pedro Gómez</td><td>102</td><td>5.50</td></tr><tr><td>4</td><td>Ana Silva</td><td>NULL</td><td>NULL</td></tr></table><p style="margin:8px 0 0;color:var(--soft);font-size:.88rem">Además: <code>email</code> y <code>clave_hash</code> (dato confidencial).</p></div></div>`}
function exo(k){const e=D[k-1],s=S&&S[k-1];
return `<div class="hero"><div class="num">${e.n}</div><h2>${e.t}</h2></div><div class="intro">${e.intro}</div>`
+e.parts.map(p=>`<div class="part"><i>${p[0]}</i><div>${p[1]}</div></div>`).join('')
+`<div class="tools"><button id="bh">💡 Pista</button>${s?'<button id="bs">✅ Ver solución</button>':''}</div>`
+`<div class="box hint ${st['h'+k]?'open':''}" id="hh"><b>Para orientarte:</b><ul>${e.hint.map(h=>`<li>${h}</li>`).join('')}</ul></div>`
+(s?`<div class="box sol ${st['s'+k]?'open':''}" id="hs">${s.code.map(c=>`<h4>Parte ${c[0]}</h4><pre>${c[1].replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre>`).join('')}<h4>Explicación</h4>${s.notes.map(n=>`<div class="nt"><b class="t">${n[0]}.</b> ${n[1]}</div>`).join('')}</div>`:'')}
function go(n){i=Math.max(0,Math.min(3,n));render();scrollTo(0,0)}
function render(){const e=i?D[i-1]:{c:'#6d4aff',c2:'#2f80ff'};
const r=document.documentElement.style;r.setProperty('--ac',e.c);r.setProperty('--ac2',e.c2);
$('#m').innerHTML=i?exo(i):intro();
$('#nav').innerHTML=L.map((l,k)=>`<button class="${k==i?'on':''}" data-k="${k}">${l}</button>`).join('');
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.k));
$('#pv').disabled=i==0;$('#nx').disabled=i==3;
$('#pv').textContent='← '+L[i-1];$('#nx').textContent=L[i+1]+' →';
if(i){$('#bh').onclick=()=>{st['h'+i]=$('#hh').classList.toggle('open')};
const b=$('#bs');if(b)b.onclick=()=>{st['s'+i]=$('#hs').classList.toggle('open')}}}
$('#pv').onclick=()=>go(i-1);$('#nx').onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1)});
render();
</script></body></html>
